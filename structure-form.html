
<!DOCTYPE html>
<html>
<head>
    <title>Structural Change Test</title>
</head>
<body>

    <section class="personal-details">
        <div class="field-wrapper">
            <label for="first_new">First Name</label>
            <div class="input-container">
                <input id="first_new"
                       type="text"
                       name="person"
                       placeholder="Enter name">
            </div>
        </div>

        <div class="field-wrapper">
            <label>Gender</label>
            <div class="radio-container">
                <label>
                    <input type="radio" name="gender_new"
                           value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender_new"
                           value="Female">
                    Female
                </label>
            </div>
        </div>

        <div class="field-wrapper">
            <label for="state_new">State</label>
            <div class="select-container">
                <select id="state_new" name="location">
                    <option>-- Select Country --</option>
                    <option>India</option>
                    <option>USA</option>
                </select>
            </div>
        </div>
    </section>

</body>
</html>
